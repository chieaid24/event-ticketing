global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The API runs on the Docker host during local development, so the scrape
  # goes through the host gateway instead of a Compose service name.
  - job_name: event-ticketing-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:4000"]
