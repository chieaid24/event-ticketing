name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-platform
  cancel-in-progress: false

jobs:
  lint:
    name: lint deploy script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck scripts/deploy-container-apps.sh

  validate:
    name: validate ${{ matrix.environment }} deployment
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [staging, production]
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.3
      - run:
          terraform fmt -check -recursive
          infrastructure/terraform/environments/${{ matrix.environment }}
      - run:
          terraform -chdir=infrastructure/terraform/environments/${{
          matrix.environment }} init -backend=false
      - run:
          terraform -chdir=infrastructure/terraform/environments/${{
          matrix.environment }} validate

  # The jobs below authenticate to Azure and promote an immutable image. They
  # stay skipped (not failed) until the AZURE_* repository variables exist, so
  # every push still lints and validates the deployment without contacting Azure.
  build:
    name: build immutable image
    needs: [lint, validate]
    if: ${{ vars.AZURE_CLIENT_ID_BUILD != '' }}
    runs-on: ubuntu-latest
    outputs:
      image-uri: ${{ steps.image.outputs.uri }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_BUILD }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: lookup
        env:
          COMMIT: ${{ github.sha }}
          REGISTRY: ${{ vars.ACR_NAME }}
          REPOSITORY: ${{ vars.ACR_REPOSITORY }}
        run: |
          digest="$(az acr repository show \
            --name "$REGISTRY" \
            --image "$REPOSITORY:$COMMIT" \
            --query digest \
            --output tsv 2>/dev/null || true)"
          if [ -n "$digest" ]; then
            printf 'exists=true\n' >> "$GITHUB_OUTPUT"
            printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          else
            printf 'exists=false\n' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.lookup.outputs.exists != 'true'
        env:
          REGISTRY: ${{ vars.ACR_NAME }}
        run: az acr login --name "$REGISTRY"
      - if: steps.lookup.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3
      - id: build
        if: steps.lookup.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/container/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags:
            ${{ vars.ACR_NAME }}.azurecr.io/${{ vars.ACR_REPOSITORY }}:${{
            github.sha }}
      - id: image
        env:
          DIGEST:
            ${{ steps.lookup.outputs.digest || steps.build.outputs.digest }}
          REGISTRY: ${{ vars.ACR_NAME }}
          REPOSITORY: ${{ vars.ACR_REPOSITORY }}
        run:
          printf 'uri=%s.azurecr.io/%s@%s\n' "$REGISTRY" "$REPOSITORY" "$DIGEST"
          >> "$GITHUB_OUTPUT"

  staging:
    name: deploy staging
    needs: build
    if: ${{ vars.AZURE_CLIENT_ID_DEPLOY != '' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_DEPLOY }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - env:
          API_APP: ${{ vars.ACA_API_APP }}
          IMAGE_URI: ${{ needs.build.outputs.image-uri }}
          MIGRATE_JOB: ${{ vars.ACA_MIGRATE_JOB }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          SMOKE_URL: ${{ vars.SMOKE_URL }}
          WEB_APP: ${{ vars.ACA_WEB_APP }}
          WORKER_APP: ${{ vars.ACA_WORKER_APP }}
        run:
          ./scripts/deploy-container-apps.sh "$RESOURCE_GROUP" "$WEB_APP"
          "$API_APP" "$WORKER_APP" "$MIGRATE_JOB" "$IMAGE_URI" "$SMOKE_URL"

  production:
    name: promote production
    needs: [build, staging]
    if: ${{ vars.AZURE_CLIENT_ID_DEPLOY != '' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_DEPLOY }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - env:
          API_APP: ${{ vars.ACA_API_APP }}
          IMAGE_URI: ${{ needs.build.outputs.image-uri }}
          MIGRATE_JOB: ${{ vars.ACA_MIGRATE_JOB }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          SMOKE_URL: ${{ vars.SMOKE_URL }}
          WEB_APP: ${{ vars.ACA_WEB_APP }}
          WORKER_APP: ${{ vars.ACA_WORKER_APP }}
        run:
          ./scripts/deploy-container-apps.sh "$RESOURCE_GROUP" "$WEB_APP"
          "$API_APP" "$WORKER_APP" "$MIGRATE_JOB" "$IMAGE_URI" "$SMOKE_URL"
