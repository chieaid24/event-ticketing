name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://event_ticketing:example-local-only-password@127.0.0.1:5432/event_ticketing?schema=public
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.3
      - run: pnpm install --frozen-lockfile
      # cheapest checks first so format/type errors fail fast
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: shellcheck scripts/deploy-container-apps.sh
      - run: terraform fmt -check -recursive infrastructure/terraform
      - run:
          terraform -chdir=infrastructure/terraform/foundation init
          -backend=false
      - run: terraform -chdir=infrastructure/terraform/foundation validate
      - run:
          terraform -chdir=infrastructure/terraform/environments/staging init
          -backend=false
      - run:
          terraform -chdir=infrastructure/terraform/environments/staging
          validate
      - run:
          terraform -chdir=infrastructure/terraform/environments/production init
          -backend=false
      - run:
          terraform -chdir=infrastructure/terraform/environments/production
          validate
      - run: docker compose config --quiet
      - run: docker compose up --detach --wait
      - run: pnpm db:migrate
      - run: pnpm db:seed
      # test:races repeats suite by race_runs
      - run: pnpm test:races
        env:
          RACE_RUNS: 3
      - run: pnpm test:recovery
      # runner has browser libs; apt mirrors stall ci
      - run: pnpm exec playwright install chromium
        timeout-minutes: 5
      - run: pnpm test:e2e
      - run:
          docker build --file infrastructure/container/Dockerfile --tag
          event-ticketing:test .
      - run: pnpm smoke:api
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: always()
        run: docker compose down --volumes
