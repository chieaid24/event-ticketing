name: event-ticketing

services:
  postgres:
    image: postgres:18.4-alpine3.23@sha256:996d0920e4ff9df1fc19dacb904492f3c1ec0ec1cc338f0ad7123be7731c5f5e
    environment:
      POSTGRES_DB: event_ticketing
      POSTGRES_PASSWORD: example-local-only-password
      POSTGRES_USER: event_ticketing
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_ticketing -d event_ticketing"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:8.8.1-alpine3.23@sha256:8096655e437712b07503796fb64d81359256cfcff0ab29d95a7da72863786efb
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  mailpit:
    image: axllent/mailpit:v1.30.5@sha256:b868afa176bfd6cce2323ea316cd99ccad77915e51e595748f6d786700ecf109
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    volumes:
      - mailpit-data:/data
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 500

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_PASSWORD: example-local-only-password
      MINIO_ROOT_USER: event-ticketing
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://127.0.0.1:9000/minio/health/ready",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 event-ticketing
        example-local-only-password && mc mb --ignore-existing local/turbo-cache
    restart: "no"

  turbo-remote-cache:
    image: ducktors/turborepo-remote-cache:2.12.0@sha256:d5cd81fc2f289b6c37ad8f3361a9abab5c359577d7809981ece045cefc21756f
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      S3_ACCESS_KEY: event-ticketing
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_SECRET_KEY: example-local-only-password
      STORAGE_PATH: turbo-cache
      STORAGE_PROVIDER: s3
      TURBO_TOKEN: example-local-only-turbo-token
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--output-document=/dev/null",
          "http://127.0.0.1:3000/v8/artifacts/status",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "127.0.0.1:9080:3000"

  prometheus:
    image: prom/prometheus:v3.9.1@sha256:1f0f50f06acaceb0f5670d2c8a658a599affe7b0d8e78b898c1035653849a702
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--output-document=/dev/null",
          "http://127.0.0.1:9090/-/ready",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:12.3.1@sha256:2175aaa91c96733d86d31cf270d5310b278654b03f5718c59de12a865380a31f
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: example-local-only-password
      GF_SECURITY_ADMIN_USER: event-ticketing
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--output-document=/dev/null",
          "http://127.0.0.1:3000/api/health",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/observability/dashboard.json:/var/lib/grafana/dashboards/event-ticketing.json:ro
      - grafana-data:/var/lib/grafana

volumes:
  grafana-data:
  mailpit-data:
  minio-data:
  postgres-data:
  prometheus-data:
  redis-data:
